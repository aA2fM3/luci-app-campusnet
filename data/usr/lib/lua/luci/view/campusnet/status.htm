<script type="text/javascript">//<![CDATA[
	var CAMPUS_STATUS_URL = '<%=luci.dispatcher.build_url("admin","services","campusnet_status")%>';
	var CAMPUS_RUN_URL = '<%=luci.dispatcher.build_url("admin","services","campusnet_run")%>';

	function campusnet_render(data) {
		var tb = document.getElementById('campusnet_status');
		if (!tb) return;
		var rows = '';
		if (data && data.found === 1) {
			rows += '<tr><td width="30%%">无线接口</td><td>' + (data.device || '-') + '</td></tr>';
			rows += '<tr><td>本机 IP</td><td>' + (data.ip || '-') + '</td></tr>';
			rows += '<tr><td>当前 MTU</td><td>' + (data.mtu || '-') + '</td></tr>';
			rows += '<tr><td>使用账号</td><td>' + (data.account || '-') + '</td></tr>';
			rows += '<tr><td>外网状态</td><td>' + (data.online === 1
				? '<span style="color:green;font-weight:bold">在线</span>'
				: '<span style="color:red;font-weight:bold">不通</span>') + '</td></tr>';
			rows += '<tr><td>探活目标</td><td>' + (data.probe || '-') + '</td></tr>';
		} else {
			rows += '<tr><td colspan="2">未连接到目标 SSID（或尚未获取 IP）';
			if (data.account) rows += '，当前账号：' + data.account;
			rows += '</td></tr>';
		}
		tb.innerHTML = rows;
	}

	function campusnet_poll() {
		XHR.get(CAMPUS_STATUS_URL, null, function(x, data) {
			campusnet_render(data);
		});
	}

	function campusnet_run(btn) {
		if (btn) btn.disabled = true;
		XHR.get(CAMPUS_RUN_URL, null, function() {
			setTimeout(function() {
				campusnet_poll();
				if (btn) btn.disabled = false;
			}, 4000);
		});
	}

	setInterval(campusnet_poll, 5000);
	window.onload = campusnet_poll;
//]]></script>

<table class="table" width="100%">
	<tbody id="campusnet_status"></tbody>
</table>
<input class="btn cbi-button cbi-button-apply" type="button" value="立即测试/登录" onclick="campusnet_run(this)" />
